<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parallel Brew Scheduler</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky header → full-width timeline workbench → panel deck (recipe column + tabbed tools on wide screens, tabs on phones).
   Prototype v0.7-p1 — built from [[Parallel Brew Scheduler - Requirements]] v0.7. */
:root {
  --bg: #eef1f5; --surface: #ffffff; --surface-2: #e4e9ef; --line: #cfd6df; --line-strong: #8e9aaa;
  --fg: #17202b; --muted: #556274; --faint: #8592a3;
  --accent: #c7860a; --accent-ink: #1d1404; --accent-soft: #f7e6bd;
  --pour: #2f6a8c; --pour-ink: #ffffff; --op: #8b4e27; --op-ink: #ffffff; --wait: #7d8a9b;
  --err: #c0362c; --err-soft: #f8dcd8; --warn: #a86c0c; --warn-soft: #f6e8c9; --ok: #2b8150; --ok-soft: #d6eedf;
  --t1: #e6eaef; --t2: #d3dae2; --t3: #a5b0bd; --t4: #5f6c7c;
  --valve-closed: #2f6a8c; --valve-open: #9fc3d8;
  --font-sans: "IBM Plex Sans JP", "Hiragino Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 6px; --lane-h: 58px; --label-w: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e131a; --surface: #151c25; --surface-2: #1c2531; --line: #2a3542; --line-strong: #4d5b6d;
  --fg: #e5eaf0; --muted: #9ba7b6; --faint: #6b7889;
  --accent: #f0b03a; --accent-ink: #1d1404; --accent-soft: #3b2c0f;
  --pour: #4b90bb; --pour-ink: #08131b; --op: #c47b47; --op-ink: #1a0d04; --wait: #6c7a8c;
  --err: #ef5d53; --err-soft: #3d1a17; --warn: #e3a541; --warn-soft: #3a2a0f; --ok: #4fb57d; --ok-soft: #12301f;
  --t1: #19212b; --t2: #232d39; --t3: #3e4a59; --t4: #8d99a8;
  --valve-closed: #4b90bb; --valve-open: #24435a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #151c25; --surface-2: #1c2531; --line: #2a3542; --line-strong: #4d5b6d;
  --fg: #e5eaf0; --muted: #9ba7b6; --faint: #6b7889;
  --accent: #f0b03a; --accent-ink: #1d1404; --accent-soft: #3b2c0f;
  --pour: #4b90bb; --pour-ink: #08131b; --op: #c47b47; --op-ink: #1a0d04; --wait: #6c7a8c;
  --err: #ef5d53; --err-soft: #3d1a17; --warn: #e3a541; --warn-soft: #3a2a0f; --ok: #4fb57d; --ok-soft: #12301f;
  --t1: #19212b; --t2: #232d39; --t3: #3e4a59; --t4: #8d99a8;
  --valve-closed: #4b90bb; --valve-open: #24435a; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { margin: 0; font: 400 14px/1.45 var(--font-sans); -webkit-text-size-adjust: 100%; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.lbl { font: 500 10.5px/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
h2 { font-size: 15px; font-weight: 600; margin: 0; text-wrap: balance; }
h3 { font-size: 13px; font-weight: 600; margin: 0; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; padding: 0 11px; border-radius: var(--r);
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--line-strong); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { color: var(--err); }
.btn.danger.armed { background: var(--err); border-color: var(--err); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.sm { min-height: 26px; padding: 0 8px; font-size: 12px; }
.btn.icon { width: 32px; padding: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; min-height: 30px; padding: 0 10px; cursor: pointer; font: 500 12px var(--font-mono); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.seg button[disabled] { opacity: .4; cursor: not-allowed; }
input[type="text"], input[type="number"], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 5px 7px; min-height: 30px; min-width: 0; }
input[type="number"] { font-family: var(--font-mono); }
input.clock { font-family: var(--font-mono); width: 70px; }
input.w-num { width: 70px; }
input:disabled, select:disabled { opacity: .5; }
textarea { width: 100%; resize: vertical; }
input[type="range"] { accent-color: var(--accent); width: 100%; min-width: 0; }
input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
.field { display: grid; gap: 4px; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.spacer { flex: 1; }
.note { font-size: 12px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font: 600 11px/1.6 var(--font-mono); letter-spacing: .04em; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.err { background: var(--err-soft); color: var(--err); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.neutral { background: var(--surface-2); color: var(--muted); }
.chip { display: inline-block; padding: 1px 6px; border-radius: 4px; font: 600 10px/1.5 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; }
.chip.pour { background: var(--pour); color: var(--pour-ink); }
.chip.op { background: var(--op); color: var(--op-ink); }
.chip.wait { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.chip.custom { border: 1px dashed var(--line-strong); color: var(--fg); }

/* header */
.app-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line); }
.app-head .inner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 8px; }
.brand { display: grid; line-height: 1.15; min-width: 0; }
.brand b { font-size: 15px; letter-spacing: -.01em; }
.brand span { font: 500 10px var(--font-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.recipe-title { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }
.notices { display: grid; gap: 6px; }
.notice { border: 1px solid var(--warn); background: var(--warn-soft); color: var(--fg); border-radius: var(--r); padding: 8px 10px; font-size: 13px; display: flex; gap: 8px; align-items: flex-start; }
.notice.err { border-color: var(--err); background: var(--err-soft); }

/* timeline */
.workbench { padding-block: 12px 0; display: grid; gap: 8px; }
.tl-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tl-frame { display: grid; grid-template-columns: var(--label-w) minmax(0, 1fr); border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.tl-labels { border-right: 1px solid var(--line); background: var(--surface); position: relative; z-index: 3; }
.tl-labels .axis-spacer { height: 26px; border-bottom: 1px solid var(--line); }
.lane-label { height: var(--lane-h); display: grid; align-content: center; gap: 1px; padding: 0 8px; border-bottom: 1px solid var(--line); }
.lane-label:last-child { border-bottom: 0; }
.lane-label b { font: 700 18px/1 var(--font-mono); }
.lane-label small { font: 500 10px var(--font-mono); color: var(--muted); }
.lane-label .pin { color: var(--accent); font-size: 10px; }
.tl-scroll { overflow-x: auto; overflow-y: hidden; position: relative; touch-action: pan-x; overscroll-behavior-x: contain; }
.tl-canvas { position: relative; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.tl-axis { height: 26px; position: relative; border-bottom: 1px solid var(--line); }
.tl-axis span { position: absolute; top: 6px; transform: translateX(-50%); font: 500 10.5px var(--font-mono); color: var(--muted); white-space: nowrap; }
.tl-axis span.min { color: var(--fg); font-weight: 600; }
.tl-grid { position: absolute; left: 0; right: 0; top: 26px; bottom: 0; pointer-events: none; }
.tl-grid .t12 { position: absolute; inset: 0; }
.gl { position: absolute; top: 0; bottom: 0; width: 1px; }
.gl.t3 { background: var(--t3); }
.gl.t4 { background: var(--t4); width: 2px; margin-left: -.5px; }
.lane { position: relative; height: var(--lane-h); border-bottom: 1px solid var(--line); }
.lane:last-child { border-bottom: 0; }
.blk { position: absolute; top: 9px; height: 34px; border-radius: 4px; overflow: hidden; display: flex; align-items: center; gap: 4px; padding: 0 5px;
  font: 500 11px/1.1 var(--font-mono); white-space: nowrap; cursor: pointer; z-index: 2; }
.blk.pour { background: var(--pour); color: var(--pour-ink); }
.blk.op { background: var(--op); color: var(--op-ink); padding: 0 2px; justify-content: center; }
.blk.wait { background: repeating-linear-gradient(-45deg, var(--surface-2) 0 4px, transparent 4px 8px), var(--surface); color: var(--muted); border: 1px solid var(--line-strong); }
.blk.custom { border: 1.5px dashed var(--fg); color: var(--fg); background: var(--surface); }
.blk.custom.hands { background: var(--surface-2); }
.blk.custom:not(.hands) { background: repeating-linear-gradient(-45deg, var(--surface-2) 0 4px, transparent 4px 8px), var(--surface); }
.blk .end { opacity: .8; margin-left: auto; padding-left: 4px; }
.blk.sel { outline: 2px solid var(--accent); outline-offset: 1px; z-index: 4; }
.blk.hl { box-shadow: 0 0 0 2px var(--accent); }
.blk.flag::after { content: "!"; position: absolute; top: 1px; right: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--err); color: #fff; font: 700 9px/13px var(--font-mono); text-align: center; }
.lane.ro .blk { opacity: .62; }
.tl-canvas.editing .lane.ro .blk { opacity: .5; }
.blk .sw { display: inline-flex; align-items: center; gap: 2px; }
.valve { position: absolute; top: 45px; height: 5px; border-radius: 2px; z-index: 1; }
.valve.closed { background: var(--valve-closed); }
.valve.open { background: repeating-linear-gradient(90deg, var(--valve-open) 0 3px, transparent 3px 5px); border: 1px solid var(--valve-closed); height: 5px; }
.handle { position: absolute; top: 5px; height: 42px; width: 24px; margin-left: -12px; z-index: 6; cursor: ew-resize; touch-action: none; display: none; }
.handle::after { content: ""; position: absolute; left: 10px; top: 9px; bottom: 9px; width: 4px; border-radius: 2px; background: var(--fg); opacity: .55; }
.handle.trade::after { background: var(--accent); opacity: 1; }
.tl-canvas.editing .handle { display: block; }
.lanestart { position: absolute; top: 3px; width: 24px; height: 52px; margin-left: -12px; z-index: 7; cursor: ew-resize; touch-action: none; display: none; }
.lanestart::before { content: ""; position: absolute; left: 11px; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.lanestart::after { content: "⇔"; position: absolute; left: 3px; top: -1px; width: 18px; height: 16px; border-radius: 3px; background: var(--accent); color: var(--accent-ink); font: 700 10px/16px var(--font-mono); text-align: center; }
.tl-canvas.editing .lanestart { display: block; }
.tl-canvas.editing .lane.a .blk { touch-action: none; cursor: grab; }
.band { position: absolute; top: 26px; bottom: 0; z-index: 1; pointer-events: none; }
.band.clash { background: color-mix(in srgb, var(--err) 26%, transparent); border-left: 1px solid var(--err); border-right: 1px solid var(--err); }
.band.tight { background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--warn) 45%, transparent) 0 2px, transparent 2px 4px); min-width: 2px; }
.limit-line { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed var(--err); z-index: 5; pointer-events: none; }
.limit-line span { position: absolute; top: 4px; left: 4px; font: 600 10px var(--font-mono); color: var(--err); background: var(--surface); padding: 0 3px; white-space: nowrap; }
.playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); z-index: 8; pointer-events: none; }
.playhead::before { content: ""; position: absolute; top: 0; left: -5px; border: 6px solid transparent; border-top-color: var(--accent); }
.drop-mark { position: absolute; top: 4px; bottom: 4px; width: 3px; background: var(--accent); z-index: 9; border-radius: 2px; }
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--fg); color: var(--bg); padding: 5px 8px; border-radius: 5px; font: 500 11.5px/1.35 var(--font-mono); white-space: nowrap; }
.ghost { opacity: .35; }

/* deck */
.deck { display: grid; gap: 12px; padding-block: 12px 40px; grid-template-columns: minmax(0, 1fr); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.panel > header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel .body { padding: 12px; display: grid; gap: 12px; min-width: 0; }
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); padding: 0 6px; }
.tabs button { border: 0; background: transparent; padding: 10px 10px 8px; cursor: pointer; font: 500 12px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs .count { font-size: 10px; margin-left: 3px; }
@media (min-width: 1000px) {
  .deck { grid-template-columns: minmax(380px, 5fr) minmax(0, 6fr); align-items: start; }
  .tabs button[data-tab="recipe"] { display: none; }
}
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stats > div { background: var(--surface-2); padding: 7px 9px; display: grid; gap: 2px; }
.stats b { font: 600 16px var(--font-mono); font-variant-numeric: tabular-nums; }
.steps { display: grid; gap: 4px; }
.srow { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; padding: 6px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); }
.srow.sel { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.srow .idx { font: 600 11px var(--font-mono); color: var(--faint); text-align: right; }
.srow .main { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.srow .main input[type="text"] { width: 120px; flex: 1 1 100px; }
.srow .times { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font: 500 11.5px var(--font-mono); color: var(--muted); }
.srow .times .flag { color: var(--err); font-weight: 600; }
.srow .times .wflag { color: var(--warn); font-weight: 600; }
.srow .ctl { display: flex; gap: 2px; }
.defining { border-color: var(--accent) !important; }
.issues { display: grid; gap: 6px; }
.issue { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: start; padding: 7px 9px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface); text-align: left; cursor: pointer; }
.issue.err { border-left: 4px solid var(--err); }
.issue.warn { border-left: 4px solid var(--warn); }
.issue small { color: var(--muted); display: block; font-size: 12px; }
.stagger-wrap { overflow-x: auto; }
canvas.stagger { display: block; width: 100%; height: 54px; border-radius: 4px; cursor: pointer; touch-action: manipulation; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 5px; }
.sw-clear { background: var(--ok); } .sw-tight { background: var(--warn); } .sw-clash { background: var(--err); } .sw-over { background: repeating-linear-gradient(-45deg, var(--ok) 0 2px, var(--surface) 2px 4px); border: 1px solid var(--ok); } .sw-off { background: var(--line); }
.plist { display: grid; gap: 6px; }
.prow { display: grid; gap: 6px; padding: 8px; border: 1px solid var(--line); border-radius: 5px; }
.lib-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 5px; }
.lib-row.open { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.lib-row .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font: 500 11.5px var(--font-mono); color: var(--muted); }
.lib-row .acts { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; align-items: start; }
.subhead { display: flex; align-items: center; gap: 8px; padding-top: 4px; }
.subhead::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--font-mono); }
.disabled-zone { opacity: .5; pointer-events: none; }

/* preview panels (shared with bar mode) */
.now-grid { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 560px) { .now-grid { grid-template-columns: minmax(0, 1fr); } }
.donow, .next { border-radius: var(--r); padding: 12px; border: 1px solid var(--line); background: var(--surface-2); display: grid; gap: 4px; min-width: 0; }
.donow.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.donow.active .lbl { color: var(--accent-ink); }
.donow.clash { background: var(--err); border-color: var(--err); color: #fff; }
.donow.clash .lbl { color: #fff; }
.next.cue { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), inset 0 0 0 1px var(--accent); }
.big { font: 600 22px/1.15 var(--font-sans); }
.cards { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.dcard { border: 1px solid var(--line); border-radius: var(--r); padding: 9px 10px; display: grid; gap: 3px; background: var(--surface); }
.dcard.hands { border-color: var(--accent); }
.dcard .top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.dcard b.l { font: 700 20px/1 var(--font-mono); }
.sheet { display: grid; gap: 2px; max-height: 280px; overflow-y: auto; }
.sheet button { display: grid; grid-template-columns: 64px 26px minmax(0, 1fr) auto; gap: 8px; align-items: center; text-align: left; padding: 5px 7px; border: 0; border-radius: 4px; background: transparent; cursor: pointer; font-size: 13px; }
.sheet button:hover { background: var(--surface-2); }
.sheet button.past { opacity: .45; }
.sheet button.cur { background: var(--accent-soft); }
body.cue-pre::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 100; box-shadow: inset 0 0 0 6px var(--accent); animation: edge 1s ease-in-out infinite alternate; }
@keyframes edge { from { opacity: .35; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { body.cue-pre::after { animation: none; opacity: 1; } * { scroll-behavior: auto !important; } }

/* modal */
.scrim { position: fixed; inset: 0; background: color-mix(in srgb, var(--fg) 40%, transparent); z-index: 70; display: grid; place-items: end center; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
@media (min-width: 640px) { .scrim { place-items: center; } }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; width: min(560px, 100%); max-height: min(82vh, 760px); overflow-y: auto; display: grid; }
.modal > header { position: sticky; top: 0; background: var(--surface); display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); z-index: 1; }
.modal .body { padding: 14px; display: grid; gap: 12px; }
.addgrid { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }

  if (t < 0) { for (const k of [3, 2, 1]) if (ui.bar.prev < -k && t >= -k) beep(k === 1 ? 990 : 880, 0.1); }
  processCues(ui.bar.prev, t, L.events);
  ui.bar.prev = t;
  const host = document.getElementById('bar-live'); if (host) host.replaceChildren(barLive(t));
  document.body.classList.toggle('cue-pre', t >= 0 ? L.cuePre : t >= -3);
  requestAnimationFrame(barFrame);
}
function compactTimeline(t) {
  const r = rec(), w0 = t - 5, span = 60, wrap = h('div', { class: 'compact', 'aria-label': 'Next 60 seconds' });
  const T = tokens(), col = { pour: T.pour, op: T.op, wait: 'transparent', custom: 'transparent' };
  A.starts.forEach((off, d) => {
    const lane = h('div', { class: 'cl', style: `top:${d * 30}px` });
    lane.append(h('span', { class: 'mono', style: 'position:absolute;left:4px;top:7px;font-size:10px;z-index:2', text: LETTERS[d] }));
    for (const row of A.res.rows) {
      const s = off + row.start, e = off + row.end; if (e < w0 || s > w0 + span) continue;
      const left = (s - w0) / span * 100, width = (e - s) / span * 100, hands = row.handsOn;
      lane.append(h('div', { class: 'cb', style: `left:${left}%;width:${width}%;background:${hands ? (row.step.category === 'op' ? col.op : col.pour) : 'transparent'};color:${hands ? '#fff' : 'inherit'};border:1px ${hands ? 'solid transparent' : 'dashed ' + T.line}`, text: row.step.name }));
    }
    wrap.append(lane);
  });
  wrap.append(h('div', { class: 'now', style: `left:${5 / span * 100}%` }));
  return wrap;
}
function barLive(t) {
  if (t < 0) {
    const first = liveState(0, A).events[0];
    return h('div', { style: 'display:grid;gap:12px;justify-items:center;padding-block:20px' }, h('span', { class: 'lbl', text: 'Lead-in · starting' }), h('div', { class: 'leadin', text: Math.ceil(-t) }),
      first ? h('div', { class: 'big', text: `${LETTERS[first.d]} · ${actionText(first.row)}` }) : null);
  }
  const { el } = renderLivePanels(t, A);
  return h('div', { style: 'display:grid;gap:12px' }, h('div', { class: 'row' }, h('div', { class: 'clock', text: fmt(t) }), h('span', { class: 'note', text: 'session clock · ends ' + fmt(A.end) })), el, compactTimeline(t));
}
function renderBar(r) {
  const b = ui.bar, ds = S.deviceSettings, large = ds.largeText;
  const largeToggle = h('label', { class: 'row', for: 'large-text' }, h('input', { type: 'checkbox', id: 'large-text', checked: large, onchange: e => { ds.largeText = e.target.checked; save(); render(); } }), h('span', { text: 'Large text' }));
  const head = h('div', { class: 'row' }, h('div', { class: 'brand' }, h('b', { text: r.name }), h('span', { text: 'Bar mode · 1× only · no editing' })), h('span', { class: 'spacer' }), statusPill(A));
  const root = h('div', { class: 'bar wrap' + (large ? ' large' : '') }, head);
  if (b.phase === 'check') {
    root.append(h('dl', { class: 'kv' },
      h('dt', { text: 'Drippers' }), h('dd', { text: String(r.pipeline.drippers) }),
      r.pipeline.drippers > 1 ? [h('dt', { text: 'Default gap' }), h('dd', { text: fmt(r.pipeline.defaultGapS) })] : null,
      r.pipeline.drippers === 3 ? [h('dt', { text: 'C starts' }), h('dd', { text: fmt(A.starts[2]) + (r.pipeline.pinnedStartC != null ? ' (pinned)' : '') })] : null,
      h('dt', { text: 'Session end' }), h('dd', { text: fmt(A.end) }),
      h('dt', { text: 'Dose · water' }), h('dd', { text: `${r.doseG} g · ${A.totalWater} g · ${r.tempC} °C` })));
    if (A.errors) root.append(h('div', { class: 'issues' }, A.all.filter(i => i.sev === 'error').map(i => h('div', { class: 'issue err' }, h('span', { class: 'pill err', text: 'Error' }), h('span', null, h('b', { text: i.title }), h('small', { text: i.detail }))))));
    root.append(h('div', { class: 'row' }, h('label', { class: 'row', for: 'bar-sound' }, h('input', { type: 'checkbox', id: 'bar-sound', checked: ds.sound, onchange: e => { ds.sound = e.target.checked; save(); } }), h('span', { text: 'Sound' })),
      h('button', { class: 'btn', id: 'test-beep', onclick: () => { ensureAudio(); beep(880, 0.12); beep(880, 0.1, 0.18); } }, 'Test beep'), largeToggle));
    root.append(h('div', { class: 'row' }, h('span', { class: 'lbl', text: 'Lead-in' }), h('div', { class: 'seg' }, [0, 3, 5, 10].map(v => h('button', { 'aria-pressed': ds.leadInS === v, onclick: () => { ds.leadInS = v; save(); render(); } }, v ? v + ' s' : 'Off')))));
    if (b.wakeOK === false) root.append(h('div', { class: 'notice' }, h('span', { text: 'The screen may lock during the run. Set Auto-Lock to Never while brewing.' })));
    root.append(h('div', { class: 'row' }, h('button', { class: 'btn primary', id: 'start-run', onclick: startRun }, A.errors ? 'Start anyway' : 'Start'), h('button', { class: 'btn', id: 'back-design', onclick: exitBar }, 'Back to design')));
  } else if (b.phase === 'resume') {
    root.append(h('div', { class: 'notice' }, h('span', { text: 'A run was in progress when the page closed.' })));
    root.append(h('div', { class: 'row' }, h('button', { class: 'btn primary', id: 'resume-run', onclick: () => { ensureAudio(); requestWake(); ui.bar = { phase: 'run', prev: runT() }; render(); requestAnimationFrame(barFrame); } }, 'Resume at ' + fmt(Math.max(0, runT()))),
      h('button', { class: 'btn', onclick: exitBar }, 'Back to design')));
  } else if (b.phase === 'run') {
    const paused = !!(S.activeRun && S.activeRun.pausedAtMs);
    root.append(h('div', { id: 'bar-live' }, barLive(runT())));
    root.append(h('div', { class: 'row' },
      h('button', { class: 'btn primary', id: 'pause', onclick: togglePause }, paused ? '▶ Resume' : '❚❚ Pause'),
      h('button', { class: 'btn danger' + (b.stopArm ? ' armed' : ''), id: 'stop', onclick: stopTap }, b.stopArm ? 'Tap again to stop' : '■ Stop'),
      largeToggle, paused ? h('span', { class: 'pill warn', text: 'Paused' }) : null));
  } else if (b.phase === 'end') {
    const fin = A.starts.map((off, d) => [d, off + A.res.length]);
    root.append(h('h2', { text: 'Session finished' }), h('dl', { class: 'kv' }, fin.map(([d, f]) => [h('dt', { text: 'Dripper ' + LETTERS[d] }), h('dd', { text: 'finished at ' + fmt(f) })]),
      h('dt', { text: 'Finish spread' }), h('dd', { text: fmt(fin[fin.length - 1][1] - fin[0][1]) + ' (how long the first cup waits)' })));
    root.append(h('div', { class: 'row' }, h('button', { class: 'btn primary', id: 'back-design', onclick: exitBar }, 'Back to design')));
  }
  return root;
}

/* ===================== start-up ===================== */
document.addEventListener('keydown', e => {
  if (ui.bar) return;
  const typing = e.target.closest && e.target.closest('input,textarea,select');
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (e.key === 'Escape' && ui.modal) { if (ui.modal.type === 'conflict') { ui.importPlan = null; toast('Import cancelled. Nothing was changed.'); } ui.modal = null; render(); }
});
let rsz = null; window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => { if (!ui.drag) render(); }, 150); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => render());
document.addEventListener('visibilitychange', () => { if (!document.hidden && ui.bar && ui.bar.phase === 'run') { ui.bar.prev = runT(); requestWake(); } });
(function boot() {
  const ar = S.activeRun;
  if (ar) {
    const r = S.recipes.find(x => x.id === ar.recipeId);
    if (r) { S.openRecipeId = r.id; const end = analyse(r).end; if (runT() < end) ui.bar = { phase: 'resume' }; else { S.activeRun = null; save(true); } }
    else { S.activeRun = null; save(true); }
  }
  render();
  if (!ui.bar) scrollToTime(0);
})();
